<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrinkle Laundry Service Command Center</title>
    <link rel="stylesheet" href="styles/main.css">
    <!-- Included in Main process now -->
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="top-nav">
            <div class="brand">
                <img src="../../assets/icons/logo.png" alt="Wrinkle Release Laundry Service" class="logo" id="brand-logo" onerror="this.style.display='none'; document.getElementById('brand-text-logo').style.display='inline-block';">
                <span id="brand-text-logo" style="display: none; font-weight: 800; color: var(--accent-primary); font-size: 1.5rem; letter-spacing: -0.5px; margin-right: 0.5rem;">Wrinkle Release</span>
                <h1>Command Center</h1>
            </div>
            <div class="controls">
                <div class="status-pill offline" id="connection-status">
                    <span class="indicator"></span>
                    <span class="text">Connecting...</span>
                </div>
            </div>
        </header>

        <!-- Metrics Dashboard -->
        <section class="metrics-grid">
            <div class="metric-card">
                <h3 class="title">Today's Revenue</h3>
                <p class="value" id="metric-revenue">₹0.00</p>
            </div>
            <div class="metric-card">
                <h3 class="title">Active Orders</h3>
                <p class="value" id="metric-active">0</p>
            </div>
            <div class="metric-card">
                <h3 class="title">Completed</h3>
                <p class="value" id="metric-completed">0</p>
            </div>
            <div class="metric-card">
                <h3 class="title">Sync Status</h3>
                <p class="value sync-offline" id="metric-sync">Offline</p>
            </div>
        </section>

        <!-- Main Content -->
        <main class="content-area">
            <div class="orders-section">
                <div class="section-header">
                    <h2>Live Orders</h2>
                    <div class="filters">
                        <input type="text" id="search-input" placeholder="Search customer or phone...">
                        <button class="btn secondary" id="btn-new-order">New Order</button>
                    </div>
                </div>
                <div class="table-container">
                    <table id="orders-table">
                        <thead>
                            <tr>
                                <th>Bill ID</th>
                                <th>Customer Name</th>
                                <th>Phone</th>
                                <th>Total Amount</th>
                                <th>Date/Time</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody">
                            <!-- Dynamic Rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- New Order Modal -->
    <div class="modal-overlay hidden" id="order-modal">
        <div class="modal-content glass">
            <h2>Create New Order</h2>
            <form id="new-order-form">
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" id="order-name" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="order-phone" required>
                </div>
                <div class="form-group">
                    <label>Items/Services</label>
                    <textarea id="order-items" placeholder="e.g. 5x Shirts, 2x Pants" required></textarea>
                </div>
                <div class="form-group">
                    <label>Total Amount (₹)</label>
                    <input type="number" step="0.01" id="order-total" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn secondary" id="btn-cancel-order">Cancel</button>
                    <button type="submit" class="btn primary">Save Order</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
